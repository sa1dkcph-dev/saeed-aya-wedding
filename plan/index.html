<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Saeed & Aya · Wedding planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--blush:#f8e0d8;--champagne:#f9e9cf;--ivory:#fdf7ee;--gold:#d4af37;--sage:#7d8a6d;--sage-active:#5e6a50;--ink:#5a5152;--ink-soft:#6e615f;--brass:#b08d57;--bronze:#725729;--white:#fffdfb;--danger:#9b3b2e}
*{box-sizing:border-box}
body{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:18px;color:var(--ink);background:linear-gradient(180deg,var(--champagne),var(--ivory) 40%)}
header{padding:28px 16px 12px;text-align:center}
h1{margin:0;font-weight:500;font-size:34px;color:var(--bronze);letter-spacing:.02em}
.sub{color:var(--ink-soft);font-style:italic;margin-top:4px}
.count{font-size:15px;color:var(--bronze);margin-top:6px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 12px;position:sticky;top:0;background:rgba(253,247,238,.95);border-bottom:1px solid var(--brass);z-index:5}
nav button{font:inherit;font-size:17px;background:none;border:1px solid var(--brass);color:var(--bronze);padding:8px 14px;border-radius:20px;min-height:44px;cursor:pointer}
nav button.on{background:var(--bronze);color:#fff;border-color:var(--bronze)}
main{max-width:880px;margin:0 auto;padding:14px 12px 60px}
section{display:none}section.on{display:block}
.card{background:var(--white);border:1px solid #eadfcf;border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h2{font-size:22px;font-weight:600;color:var(--bronze);margin:22px 0 8px;border-bottom:1px solid var(--gold);padding-bottom:4px}
table{width:100%;border-collapse:collapse}
td{padding:8px 6px;vertical-align:top;border-bottom:1px solid #f0e6d8}
td.t{white-space:nowrap;font-weight:600;color:var(--bronze);width:90px}
td.w{color:var(--ink-soft);font-style:italic;width:150px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0e6d8}
.task:last-child{border-bottom:none}
.task input[type=checkbox]{width:26px;height:26px;margin-top:2px;accent-color:var(--sage-active);flex:none}
.task .b{flex:1}
.task .ti{font-weight:600;font-size:19px}
.task.done .ti{text-decoration:line-through;color:var(--ink-soft);font-weight:400}
.meta{font-size:15px;color:var(--ink-soft)}
.pill{display:inline-block;font-size:14px;background:var(--blush);color:var(--bronze);border-radius:12px;padding:1px 9px;margin-left:6px}
.pill.me{background:var(--sage);color:#fff}
.late{color:var(--danger);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea,select{font:inherit;font-size:17px;padding:9px 10px;border:1px solid var(--brass);border-radius:8px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
label{font-size:15px;color:var(--ink-soft);display:block;margin:8px 0 3px}
.btn{font:inherit;font-size:17px;padding:10px 18px;border-radius:22px;border:1px solid var(--bronze);background:var(--bronze);color:#fff;cursor:pointer;min-height:44px}
.btn.ghost{background:none;color:var(--bronze)}
.btn.sm{padding:5px 12px;min-height:34px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.small{font-size:15px;color:var(--ink-soft)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.msg{padding:10px 12px;border-radius:8px;background:#f3ddc4;color:#5c3d24;margin:8px 0}
.ok{background:#e4ecdc;color:#3f4c33}
.hidden{display:none!important}
details summary{cursor:pointer;color:var(--bronze)}
.fb{border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;background:var(--ivory)}
.fb.h{opacity:.55}
@media(max-width:600px){td.w{display:none}h1{font-size:28px}}
</style>
</head>
<body>
<header>
  <h1>Saeed &amp; Aya</h1>
  <div class="sub">Friday 18 September 2026 · Bellahøjgaard · doors 17.30</div>
  <div class="count" id="countdown"></div>
</header>
<nav>
  <button data-tab="plan" class="on">Day plan</button>
  <button data-tab="tasks">Tasks</button>
  <button data-tab="feedback">Feedback</button>
  <button data-tab="inbox" id="inboxTab" class="hidden">Inbox</button>
  <button id="loginBtn">Sign in</button>
</nav>
<main>
  <div class="card topbar">
    <div class="row"><span class="small">I am</span><select id="who" style="width:auto;min-width:160px"></select></div>
    <div class="small" id="status">Loading…</div>
  </div>
  <div id="loginBox" class="card hidden">
    <div class="small">Sign-in is only for Saeed, Aya and the coordinator. Enter your email and open the link we send you.</div>
    <div class="row" style="margin-top:8px"><input id="email" type="email" placeholder="email" style="flex:1;min-width:200px"><button class="btn" id="sendLink">Send link</button><button class="btn ghost" id="cancelLogin">Cancel</button></div>
    <div id="loginMsg"></div>
  </div>

  <section id="plan" class="on">
    <div id="planWrap"></div>
    <div id="planEdit" class="card hidden">
      <h2 style="margin-top:0">Add plan item</h2>
      <label>Section</label><select id="pSection"><option>Setup and morning</option><option>Reception</option></select>
      <div class="row"><div style="flex:1"><label>Time</label><input id="pTime" placeholder="18.25"></div><div style="flex:1"><label>Sort</label><input id="pSort" type="number" placeholder="3"></div></div>
      <label>What</label><input id="pWhat"><label>Who</label><input id="pWho">
      <div style="margin-top:10px"><button class="btn" id="pSave">Save</button></div>
    </div>
  </section>

  <section id="tasks">
    <div class="card row" style="justify-content:space-between">
      <label style="margin:0"><input type="checkbox" id="hideDone" style="width:auto"> hide done</label>
      <button class="btn sm hidden" id="newTaskBtn">+ New task</button>
    </div>
    <div id="taskEdit" class="card hidden">
      <h2 style="margin-top:0" id="taskEditTitle">New task</h2>
      <input type="hidden" id="tId">
      <label>Task</label><input id="tTitle">
      <div class="row"><div style="flex:1"><label>Due</label><input id="tDue" type="date"></div><div style="flex:1"><label>Assigned to</label><select id="tAssignee"></select></div></div>
      <label>Notes</label><textarea id="tNotes"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="tSave">Save</button><button class="btn ghost" id="tCancel">Cancel</button><button class="btn ghost hidden" id="tDelete" style="margin-left:auto;color:var(--danger);border-color:var(--danger)">Delete</button></div>
    </div>
    <div id="taskWrap"></div>
  </section>

  <section id="feedback">
    <div class="card">
      <h2 style="margin-top:0">Feedback &amp; suggestions</h2>
      <div class="small">Goes only to Saeed and the coordinator.</div>
      <label>Your name</label><input id="fName">
      <label>Message</label><textarea id="fMsg" placeholder="A suggestion, a question, something you've noticed…"></textarea>
      <div style="margin-top:10px"><button class="btn" id="fSend">Send</button></div>
      <div id="fResult"></div>
    </div>
  </section>

  <section id="inbox"><div id="inboxWrap"></div></section>
</main>

<script>
// ===== CONFIG — from Supabase "Connect" dialog: Project URL + publishable key (sb_publishable_…) =====
const SUPABASE_URL = "https://yqzspsalohjbbddwakiv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6cdiJL941Yh0uYe0Ynbt5Q_F-HUT2cx";
const WEDDING = new Date("2026-09-18T17:30:00+02:00");
// ================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let role = null, user = null, participants = [], tasks = [], plan = [], feedback = [];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const me = () => localStorage.getItem("who") || "";

// tabs
document.querySelectorAll("nav button[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button[data-tab]").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("on", s.id === b.dataset.tab));
  if (b.dataset.tab === "inbox") loadFeedback();
});

// countdown
(function tick(){ const d = Math.ceil((WEDDING - Date.now())/864e5); $("countdown").textContent = d > 1 ? `${d} days to go` : d === 1 ? "Tomorrow" : d === 0 ? "Today" : "Married!"; })();

// auth
$("loginBtn").onclick = async () => { if (user) { await sb.auth.signOut(); location.reload(); } else $("loginBox").classList.toggle("hidden"); };
$("cancelLogin").onclick = () => $("loginBox").classList.add("hidden");
$("sendLink").onclick = async () => {
  const email = $("email").value.trim().toLowerCase(); if (!email) return;
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split("#")[0] } });
  $("loginMsg").innerHTML = error ? `<div class="msg">${esc(error.message)}</div>` : `<div class="msg ok">Link sent to ${esc(email)}. Open it on this device.</div>`;
};
async function initAuth(){
  const { data } = await sb.auth.getSession(); user = data.session?.user || null;
  if (user) { const r = await sb.rpc("my_role"); role = r.data || null; }
  applyRole();
}
function applyRole(){
  const admin = !!role, couple = role === "couple";
  $("loginBtn").textContent = user ? `Sign out (${role || "no role"})` : "Sign in";
  $("loginBox").classList.add("hidden");
  $("inboxTab").classList.toggle("hidden", !admin);
  $("newTaskBtn").classList.toggle("hidden", !admin);
  $("planEdit").classList.toggle("hidden", !couple);
  if (user && !role) $("status").textContent = "Signed in, but this email has no role. Ask Saeed.";
}

// data
async function loadAll(){
  const [p, t, pl] = await Promise.all([
    sb.from("participants").select("*").order("sort").order("name"),
    sb.from("tasks").select("*").order("due", { nullsFirst: false }).order("id"),
    sb.from("plan").select("*").order("section", { ascending: false }).order("sort")
  ]);
  if (p.error || t.error || pl.error) { $("status").textContent = "Could not load — check the config keys."; return; }
  participants = p.data; tasks = t.data; plan = pl.data;
  renderWho(); renderPlan(); renderTasks();
  $("status").textContent = `Updated ${new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`;
}
function renderWho(){
  const sel = $("who"); const cur = me();
  sel.innerHTML = `<option value="">— choose —</option>` + participants.map(p => `<option ${p.name===cur?"selected":""}>${esc(p.name)}</option>`).join("");
  sel.onchange = () => { localStorage.setItem("who", sel.value); $("fName").value ||= sel.value; renderTasks(); };
  $("fName").value ||= cur;
  $("tAssignee").innerHTML = `<option value="">—</option>` + participants.map(p => `<option>${esc(p.name)}</option>`).join("");
}
function renderPlan(){
  const secs = ["Setup and morning", "Reception"]; let h = "";
  for (const s of secs) {
    const rows = plan.filter(r => r.section === s);
    h += `<h2>${esc(s)}</h2><div class="card"><table>` + rows.map(r =>
      `<tr><td class="t">${esc(r.time)}</td><td>${esc(r.what)}${role==="couple"?` <button class="btn ghost sm" onclick="delPlan(${r.id})">✕</button>`:""}</td><td class="w">${esc(r.who)}</td></tr>`).join("") + `</table></div>`;
  }
  $("planWrap").innerHTML = h;
}
window.delPlan = async id => { if (confirm("Remove this plan item?")) { await sb.from("plan").delete().eq("id", id); loadAll(); } };
$("pSave").onclick = async () => {
  const row = { section: $("pSection").value, time: $("pTime").value, sort: +$("pSort").value || 99, what: $("pWhat").value, who: $("pWho").value };
  if (!row.what || !row.time) return;
  const { error } = await sb.from("plan").insert(row); if (error) alert(error.message); else { $("pWhat").value = $("pWho").value = $("pTime").value = ""; loadAll(); }
};

function fmtDue(d){ if (!d) return ""; return new Date(d + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
function renderTasks(){
  const admin = !!role, mine = me(), hide = $("hideDone").checked, today = new Date().toISOString().slice(0,10);
  const list = tasks.filter(t => !(hide && t.done));
  const groups = [["Mine", list.filter(t => t.assignee === mine)], ["Everyone", list.filter(t => t.assignee !== mine)]];
  let h = "";
  for (const [name, arr] of groups) {
    if (!arr.length) continue;
    if (name === "Mine" && !mine) continue;
    h += `<h2>${name === "Mine" ? esc(mine) + " — your tasks" : mine ? "Everyone else" : "All tasks"}</h2><div class="card">` + arr.map(t => {
      const late = !t.done && t.due && t.due < today;
      return `<div class="task ${t.done?"done":""}">
        <input type="checkbox" ${t.done?"checked":""} ${admin?"":"disabled"} onchange="toggle(${t.id},this.checked)" aria-label="done">
        <div class="b"><div class="ti">${esc(t.title)}${t.assignee?`<span class="pill ${t.assignee===mine?"me":""}">${esc(t.assignee)}</span>`:""}</div>
        ${t.notes?`<div class="meta">${esc(t.notes)}</div>`:""}
        <div class="meta"><span class="${late?"late":""}">${t.due?"Due "+fmtDue(t.due):"No date"}${late?" · overdue":""}</span>${t.done&&t.done_by?` · ticked by ${esc(t.done_by)}`:""}${admin?` · <a href="#" onclick="editTask(${t.id});return false">edit</a>`:""}</div></div></div>`;
    }).join("") + `</div>`;
  }
  $("taskWrap").innerHTML = h || `<div class="card small">No tasks.</div>`;
}
$("hideDone").onchange = renderTasks;
window.toggle = async (id, done) => {
  const { error } = await sb.from("tasks").update({ done, done_at: done ? new Date().toISOString() : null, done_by: done ? (me() || user?.email) : null }).eq("id", id);
  if (error) { alert("Not allowed: " + error.message); } loadAll();
};
function openTaskEdit(t){
  $("taskEdit").classList.remove("hidden"); $("taskEditTitle").textContent = t ? "Edit task" : "New task";
  $("tId").value = t?.id || ""; $("tTitle").value = t?.title || ""; $("tDue").value = t?.due || ""; $("tAssignee").value = t?.assignee || ""; $("tNotes").value = t?.notes || "";
  $("tDelete").classList.toggle("hidden", !t); $("tTitle").focus();
}
window.editTask = id => openTaskEdit(tasks.find(t => t.id === id));
$("newTaskBtn").onclick = () => openTaskEdit(null);
$("tCancel").onclick = () => $("taskEdit").classList.add("hidden");
$("tSave").onclick = async () => {
  const row = { title: $("tTitle").value.trim(), due: $("tDue").value || null, assignee: $("tAssignee").value, notes: $("tNotes").value.trim() };
  if (!row.title) return;
  const id = $("tId").value;
  const q = id ? sb.from("tasks").update(row).eq("id", id) : sb.from("tasks").insert({ ...row, created_by: me() || user?.email });
  const { error } = await q; if (error) alert(error.message); else { $("taskEdit").classList.add("hidden"); loadAll(); }
};
$("tDelete").onclick = async () => { if (confirm("Delete this task?")) { await sb.from("tasks").delete().eq("id", $("tId").value); $("taskEdit").classList.add("hidden"); loadAll(); } };

// feedback
$("fSend").onclick = async () => {
  const name = $("fName").value.trim(), message = $("fMsg").value.trim(); if (!name || !message) return;
  $("fSend").disabled = true;
  const { error } = await sb.from("feedback").insert({ name, message });
  $("fSend").disabled = false;
  $("fResult").innerHTML = error ? `<div class="msg">${esc(error.message)}</div>` : `<div class="msg ok">Sent. Thank you!</div>`;
  if (!error) $("fMsg").value = "";
};
async function loadFeedback(){
  const { data, error } = await sb.from("feedback").select("*").order("created_at", { ascending: false });
  if (error) { $("inboxWrap").innerHTML = `<div class="card small">${esc(error.message)}</div>`; return; }
  feedback = data;
  $("inboxWrap").innerHTML = `<h2>Inbox</h2>` + (feedback.length ? feedback.map(f => `<div class="fb ${f.handled?"h":""}"><div class="row" style="justify-content:space-between"><b>${esc(f.name)}</b><span class="small">${new Date(f.created_at).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div><div>${esc(f.message)}</div><div style="margin-top:6px"><button class="btn ghost sm" onclick="handle(${f.id},${!f.handled})">${f.handled?"Mark open":"Mark handled"}</button></div></div>`).join("") : `<div class="card small">Nothing yet.</div>`);
}
window.handle = async (id, handled) => { await sb.from("feedback").update({ handled }).eq("id", id); loadFeedback(); };

// realtime + polling fallback
sb.channel("live").on("postgres_changes", { event: "*", schema: "public" }, () => loadAll()).subscribe();
setInterval(loadAll, 60000);

initAuth().then(loadAll);
sb.auth.onAuthStateChange(() => initAuth().then(loadAll));
</script>
</body>
</html>
